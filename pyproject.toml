[project]
name = "stage-scheduler"
version = "0.1.0"
description = "Deterministic rehearsal scheduling system for stage managers."
requires-python = ">=3.13"
dependencies = [
    "certifi>=2025.1.31",
    "fastapi>=0.116.0",
    "ortools>=9.15.0",
    "pypdf>=6.0.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.136.0",
    "httpx2>=0.1.0",
    "mypy>=1.16.0",
    "pytest>=8.4.0",
    "reportlab>=4.0.0",
    "ruff>=0.12.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build -- --outDir ../public"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["backend/app"]
