[project]
name = "stage-scheduler"
version = "0.1.0"
description = "Deterministic rehearsal scheduling system for stage managers."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.136.0",
    "mypy>=1.16.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["backend/app"]

